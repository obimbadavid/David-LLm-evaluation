name: Evaluate LLM Model
on: [push]
 jobs:
   evaluate:
     runs-on: ubuntu-latest
    steps:
     - uses: actions/checkout@v4
     - name: Set up Python
     - uses: actions/setup-python@v5
       with: 
         python-version: '3.10'
     - name: Run evaluation script
      run: python evaluation_script.py
